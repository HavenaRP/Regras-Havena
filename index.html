<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Havena Roleplay — Regras Oficiais</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  
  <style>
    :root {
      --theme-color: #ef4444;
      --sidebar-width: 280px;
    }

    * {
      font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
    }

    body {
      background-color: #0b0b0e !important;
      color: #e2e8f0 !important;
    }

    /* Sidebar GitBook Style */
    .sidebar {
      background-color: #121217 !important;
      border-right: 1px solid #1e1e26 !important;
      padding-top: 20px;
    }

    .sidebar h1 a {
      color: #ffffff !important;
      font-weight: 800 !important;
      font-size: 1.25rem !important;
      letter-spacing: -0.5px;
    }

    .sidebar ul li a {
      color: #94a3b8 !important;
      font-size: 0.9rem !important;
      font-weight: 500 !important;
      padding: 8px 12px !important;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .sidebar ul li a:hover {
      background-color: #1a1a24 !important;
      color: #ffffff !important;
    }

    .sidebar ul li.active > a {
      background-color: rgba(239, 68, 68, 0.15) !important;
      color: #ef4444 !important;
      font-weight: 700 !important;
    }

    /* Search Input */
    .search input {
      background-color: #181820 !important;
      border: 1px solid #272734 !important;
      color: #ffffff !important;
      border-radius: 6px !important;
      padding: 8px 12px !important;
    }

    /* Content Area */
    .content {
      background-color: #0b0b0e !important;
    }

    .markdown-section {
      max-width: 840px !important;
      padding: 30px 40px !important;
    }

    .markdown-section h1 {
      color: #ffffff !important;
      font-size: 2.1rem !important;
      font-weight: 800 !important;
      border-bottom: 1px solid #1e1e26 !important;
      padding-bottom: 10px;
    }

    .markdown-section h2 {
      color: #f8fafc !important;
      font-size: 1.4rem !important;
      font-weight: 700 !important;
      margin-top: 2em !important;
      border-bottom: none !important;
    }

    .markdown-section p, .markdown-section li {
      color: #cbd5e1 !important;
      line-height: 1.7 !important;
    }

    /* Callouts / Highlights */
    .markdown-section blockquote {
      background-color: #14141c !important;
      border-left: 4px solid #ef4444 !important;
      border-radius: 0 6px 6px 0;
      color: #e2e8f0 !important;
      padding: 14px 18px !important;
      margin: 1.5em 0 !important;
    }

    /* Tables */
    .markdown-section table {
      width: 100% !important;
      border-collapse: collapse !important;
      border: 1px solid #1e1e26 !important;
      margin: 1.5em 0 !important;
    }

    .markdown-section th {
      background-color: #161620 !important;
      color: #ef4444 !important;
      font-weight: 700 !important;
      padding: 10px 14px !important;
      border: 1px solid #1e1e26 !important;
    }

    .markdown-section td {
      background-color: #101017 !important;
      border: 1px solid #1e1e26 !important;
      padding: 10px 14px !important;
    }
  </style>
</head>
<body>
  <div id="app">Carregando Havena RP...</div>
  <script>
    window.$docsify = {
      name: 'HAVENA RP',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Pesquisar nas regras...',
        noData: 'Nenhuma regra encontrada.',
        depth: 3
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
